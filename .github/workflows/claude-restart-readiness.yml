# Read-only, zero-Claude-cost readiness check. This is NOT the Claude worker.
name: Claude restart readiness (no paid calls)

on:
  push:
    branches:
      - 'ops/claude-restart-readiness'
    paths:
      - '.github/workflows/claude-restart-readiness.yml'
  pull_request:
    paths:
      - '.github/workflows/claude-restart-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TOKEN_PRESENT: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Report current prerequisites without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          echo '## LinguaChat autonomous-chain readiness (read-only)' >> "$GITHUB_STEP_SUMMARY"
          if [ "$TOKEN_PRESENT" = 'true' ]; then
            echo '- Claude Actions token: present (validity and remaining usage NOT verified).' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- Claude Actions token: MISSING. A personal Claude-to-GitHub connection cannot substitute for this Actions credential.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f .github/workflows/claude-chain.yml ] && [ -f .github/workflows/claude-task.yml ]; then
            echo '- Chain/worker workflows: active folder.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- Chain/worker workflows: paused or incomplete; do not claim continuous execution.' >> "$GITHUB_STEP_SUMMARY"
          fi
          NEXT=$(node .github/scripts/next-task.mjs --json)
          node -e 'const q=JSON.parse(process.argv[1]); console.log(`- Next claimable task: ${q.id ?? "none"}; reason: ${q.reason}`)' "$NEXT" >> "$GITHUB_STEP_SUMMARY"
          echo '- This job did not start Claude, deploy, merge, use cloud credentials, or incur model API usage.' >> "$GITHUB_STEP_SUMMARY"
