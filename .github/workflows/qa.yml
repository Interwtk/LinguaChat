# The guardrail. Every functional PR is tested with the real deterministic suites.
name: QA

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge gate uses an explicit dispatch for the second exact-head cycle.
  # GITHUB_TOKEN-authored PR state changes do not reliably emit another workflow,
  # so the second cycle must not depend on a recursive ready_for_review event.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open PR number being re-proved; empty means an ordinary manual QA run.'
        required: false
        type: string
      expected_head_sha:
        description: 'Exact PR source head that this dispatched clean cycle must prove.'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

env:
  LINGUACHAT_PROVIDER: local

jobs:
  frontend:
    name: frontend — checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: linguachat-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: linguachat-frontend/package-lock.json
      - run: npm ci
      - name: check:all, counted by exit code
        run: |
          node - <<'NODE'
          const { execFileSync } = require('node:child_process')
          const pkg = require('./package.json')
          const scripts = pkg.scripts['check:all'].split('&&').map(s => s.trim())
          const failed = []
          for (const script of scripts) {
            const args = script.split(/\s+/).slice(1)
            try { execFileSync('node', args, { stdio: 'inherit' }) }
            catch { failed.push(args[0]) }
          }
          console.log(`\ncheck:all — ${scripts.length - failed.length}/${scripts.length} green`)
          if (failed.length) { console.error('FAILED: ' + failed.join(', ')); process.exit(1) }
          NODE
      - run: npm run build
      - run: npm run check:i18n

  backend:
    name: backend — compile and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: linguachat-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: linguachat-backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall .
      - run: python -m pytest -q

  guards:
    name: guards — nothing forbidden slipped in
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A1 must still be closed to learners
        run: |
          git grep -q "available: false" -- linguachat-frontend/src/learning/curriculum/levels.js || { echo "A1's availability line is missing from levels.js"; exit 1; }
          if git grep -nE "isLevelAvailable\(A1\)\s*=>\s*true|available:\s*true.*a1" -- 'linguachat-frontend/src/**/*.js'; then
            echo "A1 looks opened — see CLAUDE.md"; exit 1
          fi

      - name: no Supabase
        run: |
          if git grep -nE "@supabase/|from ['\"']supabase" -- linguachat-frontend/src linguachat-backend; then
            echo "Supabase is postponed — see CLAUDE.md"; exit 1
          fi

      - name: no voice or media APIs
        run: |
          if git grep -nE "SpeechRecognition|speechSynthesis|RTCPeerConnection" -- 'linguachat-frontend/src/**/*.js' 'linguachat-frontend/src/**/*.jsx'; then
            echo "Voice and media are out of scope — see CLAUDE.md"; exit 1
          fi

      - name: no build output, archives or env files tracked
        run: |
          if git ls-files | grep -E "(^|/)dist/|\.zip$|(^|/)\.env$"; then
            echo "Build output, an archive or a .env is tracked"; exit 1
          fi

      - name: the coordination files exist
        run: |
          for f in CLAUDE.md .ai/STATE.md .ai/TASKS.md .ai/HANDOFF.md; do
            test -f "$f" || { echo "$f is missing — the agent contract is incomplete"; exit 1; }
          done

      - name: the task queue keeps its structural boundaries
        run: |
          set -euo pipefail
          test "$(grep -c '^## IN_PROGRESS$' .ai/TASKS.md)" -eq 1 || { echo "TASKS.md must contain exactly one IN_PROGRESS heading"; exit 1; }
          test "$(grep -c '^## TODO\b' .ai/TASKS.md)" -eq 1 || { echo "TASKS.md must contain exactly one TODO heading"; exit 1; }
          test "$(grep -c '^## BLOCKED$' .ai/TASKS.md)" -eq 1 || { echo "TASKS.md must contain exactly one BLOCKED heading"; exit 1; }
          test "$(grep -c '^## DONE$' .ai/TASKS.md)" -eq 1 || { echo "TASKS.md must contain exactly one DONE heading"; exit 1; }
          node linguachat-frontend/scripts/check-queue-recovery.mjs

      - name: foundry automation contract is internally valid
        if: hashFiles('.ai/foundry/tasks.json') != ''
        run: |
          node .github/scripts/foundry-next.mjs --all >/dev/null
          node .github/scripts/check-foundry-automation.mjs

      - name: foundry PR stays inside its declared scope
        if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'foundry/')
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUIRE_COMPLETE: ${{ github.event.pull_request.draft == false }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_SHA" "$HEAD_SHA" --quiet
          args=(--branch "$BRANCH" --base "$BASE_SHA" --head "$HEAD_SHA")
          if [ "$REQUIRE_COMPLETE" = "true" ]; then args+=(--require-complete); fi
          node .github/scripts/check-foundry-scope.mjs "${args[@]}"

  evidence:
    name: evidence — the PR shows the QA it ran
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && inputs.expected_head_sha != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The live PR description must carry measured Evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          valid=false
          last_problem="live PR body was not read"

          # The event payload is a snapshot. PR descriptions are often updated with
          # measured counts immediately before Ready, so read the current PR directly.
          # For an automation-requested second cycle, additionally prove that the PR is
          # still Ready and still points at the exact source SHA supplied by the merge gate.
          for attempt in 1 2 3 4 5; do
            set +e
            LIVE=$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" 2>/tmp/evidence-api.err)
            api_status=$?
            set -e

            if [ "$api_status" -ne 0 ] || [ -z "$LIVE" ]; then
              last_problem="GitHub API could not return the live PR (attempt $attempt/5)"
            else
              BODY=$(printf '%s' "$LIVE" | jq -r '.body // ""')
              LIVE_SHA=$(printf '%s' "$LIVE" | jq -r '.head.sha // ""')
              LIVE_DRAFT=$(printf '%s' "$LIVE" | jq -r '.draft')
              printf '%s' "$BODY" > /tmp/body.md

              if [ "$LIVE_DRAFT" != "false" ]; then
                last_problem="PR #$PR_NUMBER is Draft, so this cannot be a clean cycle (attempt $attempt/5)"
              elif [ -z "$EXPECTED_HEAD_SHA" ] || [ "$LIVE_SHA" != "$EXPECTED_HEAD_SHA" ]; then
                last_problem="PR head changed: live=$LIVE_SHA expected=$EXPECTED_HEAD_SHA (attempt $attempt/5)"
              elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_SHA" != "$EXPECTED_HEAD_SHA" ]; then
                last_problem="dispatched QA checked out $GITHUB_SHA instead of expected PR head $EXPECTED_HEAD_SHA"
              else
                missing=""
                grep -qi '^##\s*Evidence' /tmp/body.md || missing="$missing Evidence-section"
                grep -qi 'check:all' /tmp/body.md || missing="$missing check:all"
                grep -qiE 'build' /tmp/body.md || missing="$missing build"
                grep -qiE 'pytest|compileall' /tmp/body.md || missing="$missing backend"
                if [ -z "$missing" ]; then
                  valid=true
                  break
                fi
                last_problem="live Evidence is still incomplete:$missing (attempt $attempt/5)"
              fi
            fi

            if [ "$attempt" -lt 5 ]; then sleep 5; fi
          done

          if [ "$valid" != "true" ]; then
            echo "::error::$last_problem. Put the QA actually run in the live PR description — counts, not adjectives. See CLAUDE.md."
            if [ -s /tmp/evidence-api.err ]; then tail -5 /tmp/evidence-api.err; fi
            exit 1
          fi
          echo "Live PR/Evidence and exact source head verified for PR #$PR_NUMBER at $EXPECTED_HEAD_SHA." >> "$GITHUB_STEP_SUMMARY"

  clean_cycle:
    name: qa-cycle — complete clean non-draft cycle
    if: >
      always() &&
      (
        (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
        (github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && inputs.expected_head_sha != '')
      )
    needs: [frontend, backend, guards, evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required QA jobs completed successfully in this non-draft run
        env:
          FRONTEND: ${{ needs.frontend.result }}
          BACKEND: ${{ needs.backend.result }}
          GUARDS: ${{ needs.guards.result }}
          EVIDENCE: ${{ needs.evidence.result }}
        run: |
          set -euo pipefail
          printf 'frontend=%s backend=%s guards=%s evidence=%s\n' "$FRONTEND" "$BACKEND" "$GUARDS" "$EVIDENCE"
          for result in "$FRONTEND" "$BACKEND" "$GUARDS" "$EVIDENCE"; do
            [ "$result" = "success" ] || { echo "This run is not a complete clean non-draft QA cycle."; exit 1; }
          done
          echo "Complete clean non-draft QA cycle on $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"

  merge_handoff:
    name: handoff — successful explicit cycle back to main merge lane
    # This sender intentionally targets the receiver already installed on main.
    # Never retarget it to the PR branch: the code under test must not become its own merge authority.
    if: >
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.pr_number != '' &&
      inputs.expected_head_sha != '' &&
      needs.clean_cycle.result == 'success'
    needs: [clean_cycle]
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the main-controlled merge receiver
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh workflow run qa-merge-handoff.yml --ref main \
              -f pr_number="$PR_NUMBER" \
              -f expected_head_sha="$EXPECTED_HEAD_SHA"; then
              echo "Dispatched main merge handoff for PR #$PR_NUMBER at $EXPECTED_HEAD_SHA." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep 5; fi
          done
          echo "::error::Could not dispatch main merge handoff after 5 attempts."
          exit 1
