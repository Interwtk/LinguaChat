# Close post-worker races for both the serial Claude queue and Curriculum Foundry.
#
# A coordinating workflow can observe a worker as still in_progress at the exact
# moment another event asks it to advance. This bridge emits a fresh event only
# after the worker is fully completed, so the appropriate coordinator can
# immediately re-check its queue instead of waiting for a scheduled watchdog.
name: Claude — post-worker kick

on:
  workflow_run:
    workflows:
      - "Claude — autonomous task"
      - "Claude — translations"
      - "Claude — curriculum foundry worker"
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: claude-post-worker-kick
  cancel-in-progress: false

jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the correct coordinator after the worker is fully finished
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          if [ "$SOURCE_WORKFLOW" = "Claude — curriculum foundry worker" ]; then
            gh workflow run curriculum-foundry.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main
            echo "Dispatched Curriculum Foundry after ${SOURCE_WORKFLOW} run ${SOURCE_RUN_ID} (${SOURCE_CONCLUSION})." >> "$GITHUB_STEP_SUMMARY"
          else
            gh workflow run claude-chain.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f reason="post-worker completion: ${SOURCE_WORKFLOW} run ${SOURCE_RUN_ID} (${SOURCE_CONCLUSION})"
            echo "Dispatched Claude — chain after ${SOURCE_WORKFLOW} run ${SOURCE_RUN_ID} (${SOURCE_CONCLUSION})." >> "$GITHUB_STEP_SUMMARY"
          fi
