# Dedicated internationalisation worker. It is dispatched only by Claude — chain;
# the chain owns scheduling and routing so i18n can never race the general lane.
name: Claude — translations

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Exact LC-I18N task id selected by the chain.'
        required: false
        type: string
      languages:
        description: 'Optional comma-separated implementation batch.'
        required: false
        type: string
      dry_run:
        description: 'Report what it would do, change nothing.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: linguachat-claude-writer
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LINGUACHAT_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse clearly if the token is not configured
        env:
          TOKEN_PRESENT: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$TOKEN_PRESENT" != "true" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN is not set. See .ai/HANDOFF.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: linguachat-frontend/package-lock.json

      - id: queue
        name: Validate the i18n task against next-task.mjs
        env:
          REQUESTED: ${{ inputs.task_id }}
        run: |
          set -euo pipefail
          NEXT=$(node .github/scripts/next-task.mjs || true)
          if [ -z "$NEXT" ]; then
            echo "claimable=false" >> "$GITHUB_OUTPUT"
            echo "No task is claimable."
            exit 0
          fi
          case "$NEXT" in
            LC-I18N-*) ;;
            *)
              echo "claimable=false" >> "$GITHUB_OUTPUT"
              echo "$NEXT belongs to the general lane, not i18n."
              exit 0
              ;;
          esac
          if [ -n "${REQUESTED:-}" ] && [ "$REQUESTED" != "$NEXT" ]; then
            echo "claimable=false" >> "$GITHUB_OUTPUT"
            echo "Requested $REQUESTED but the only claimable task is $NEXT. Refusing safely."
            exit 0
          fi
          echo "claimable=true" >> "$GITHUB_OUTPUT"
          echo "task_id=$NEXT" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.queue.outputs.claimable == 'true'
        with:
          python-version: '3.12'

      - name: Install
        if: steps.queue.outputs.claimable == 'true'
        run: |
          npm ci --prefix linguachat-frontend
          pip install -r linguachat-backend/requirements.txt

      - uses: anthropics/claude-code-action@v1
        if: steps.queue.outputs.claimable == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are LinguaChat's internationalisation operator.

            READ FIRST and obey over this prompt:
            CLAUDE.md, .ai/TRANSLATIONS.md, .ai/TASKS.md, .ai/STATE.md, .ai/HANDOFF.md.

            Exact task selected by the shared queue parser: "${{ steps.queue.outputs.task_id }}".
            Optional language batch: "${{ inputs.languages }}". Dry run: "${{ inputs.dry_run }}".

            AUTHORITATIVE LANGUAGE PRODUCT RULE
            The learner chooses ONE user_language. That same language governs the
            interface/chrome, explanations, hints, corrections, interpretations and
            meanings. English is the target language being learned. Legacy
            interface_language/native_language may still exist internally, but they
            represent the same user choice and must remain synchronized. Do NOT
            implement or preserve mixed interface=es/native=ja behavior.

            Examples:
            - user_language=es -> auxiliary experience Spanish; target English.
            - user_language=ja -> auxiliary experience Japanese; target English.
            - user_language=ar -> auxiliary experience Arabic/RTL; target English/LTR.
            English practice text/input stays English and LTR. Chatto is never mirrored.

            HOW TO WORK
            1. Claim exactly this LC-I18N task on main (owner `claude-i18n`) and use
               branch `i18n/<lowercase-task-id>`. The initial claim is the only normal
               direct-main coordination write.
            2. If that branch/draft PR already exists, continue it. Never duplicate it.
            3. Push a checkpoint and open a DRAFT PR within the first 15 turns; push
               every milestone and never go 20 turns without remote progress.
            4. Do only this i18n task. Copy must sound native, preserve placeholders,
               product names and target-English practice content. Never advertise a
               language as supported because English fallback happens to render.
            5. Run targeted checks while editing. Final QA always includes:
                 cd linguachat-frontend && npm run check:i18n && npm run check:all && npm run build
                 cd linguachat-backend && python -m compileall . && python -m pytest -q
               UI/i18n changes require a real browser at 390px and 1440px, including
               RTL when affected. If a fix follows validation, restart and get two
               consecutive clean cycles.
            6. BEFORE marking the PR ready, update .ai/TRANSLATIONS.md with measured
               facts and put final bookkeeping IN THIS BRANCH: move the task to DONE
               in .ai/TASKS.md and update .ai/STATE.md + .ai/HANDOFF.md. These merge
               atomically; no later direct-main completion commit.
            7. Put exact numbers and browser evidence under `## Evidence`, review the
               diff for raw keys/fallback leaks/hardcoded strings/RTL/target-English
               corruption, push, then mark ready.

            HARD LIMITS
            No curriculum scope changes, Supabase, real provider calls, voice/STT/TTS,
            WebRTC, pronunciation scoring, calls/video calls, or frozen-UI redesign.
            A1 remains unavailable until its final gate. One task per run. If turns
            run low, checkpoint the existing branch/draft and release the claim so
            the next run can resume it instead of losing work.
          allowed_bots: github-actions
          claude_args: |
            --model claude-sonnet-5
            --max-turns 120
            --allowedTools Read,Write,Edit,Glob,Grep,Bash,TodoWrite

      - name: Leave the repository honest, whatever happened
        if: always() && steps.queue.outputs.claimable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git checkout main --quiet && git reset --hard origin/main --quiet
          BRANCH=$(awk '/^## IN_PROGRESS/{f=1;next} /^## /{f=0} f' .ai/TASKS.md |
            grep -oE '^[[:space:]]+branch:[[:space:]]*\S+' | awk '{print $2}' | head -1 || true)
          if [ -z "${BRANCH:-}" ] || [ "$BRANCH" = "none" ]; then exit 0; fi

          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            RELEASED=$(node .github/scripts/release-stale-claim.mjs || true)
            if [ -n "$RELEASED" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add .ai/TASKS.md
              git commit -m "chore(ops): release $RELEASED — its i18n run pushed nothing"
              git push origin main
              echo "Released **$RELEASED** because the run pushed nothing." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          OPEN=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$OPEN" = "0" ]; then
            gh pr create --draft --base main --head "$BRANCH" \
              --title "WIP: $BRANCH" \
              --body "Automatic recovery draft. This i18n task is unfinished; continue this branch on the next run."
          fi

      - name: Nothing to do
        if: steps.queue.outputs.claimable != 'true'
        run: echo "No i18n task is claimable — clean exit without Claude cost." >> "$GITHUB_STEP_SUMMARY"
