# The translation lane, deliberately separate from the curriculum lane so the two
# never collide in the same diff: hundreds of translated strings must not arrive
# inside a curricular fix, and a curricular fix must not wait on a translation
# review. Different day, different branch prefix, different task ids.
name: Claude — translations

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'i18n task id (e.g. LC-I18N-001). Empty = first unclaimed LC-I18N-* task.'
        required: false
        type: string
      languages:
        description: 'Optional batch, comma separated (e.g. zh,ko). Small batches only.'
        required: false
        type: string
      # The chain sends `dry_run` to whichever lane it picks. A workflow that does
      # not declare an input does not merely ignore it — the dispatch is rejected
      # outright, so without this the whole i18n lane is unreachable from the chain.
      dry_run:
        description: 'Report what it would do, change nothing.'
        required: false
        default: false
        type: boolean
  schedule:
    # Thursdays, 09:00 UTC — three days away from the curriculum run.
    - cron: '0 9 * * 4'

permissions:
  contents: write
  pull-requests: write
  issues: write
  # The action exchanges a short-lived GitHub OIDC token as part of authenticating,
  # and a job cannot mint one without this. Without it the run reaches the action
  # and dies at "Failed to get OIDC token" — which is what happened on run
  # 32173192998. It grants the job the right to prove its own identity to GitHub;
  # it does not widen access to the repository or to any secret.
  id-token: write

concurrency:
  group: claude-i18n
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LINGUACHAT_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse clearly if the token is not configured
        env:
          TOKEN_PRESENT: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$TOKEN_PRESENT" != "true" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN is not set. See .ai/HANDOFF.md."
            exit 1
          fi

      - id: queue
        name: Is an i18n task claimable?
        run: |
          # Somebody else's claim counts. This lane can also be started by its own
          # Thursday schedule, with no chain in the loop to check whether an agent
          # is already alive, so the one-agent rule has to hold here too.
          if awk '/^## IN_PROGRESS/{f=1;next} /^## /{f=0} f' .ai/TASKS.md | grep -qE '^\s*- \[LC-'; then
            echo "claimable=false" >> "$GITHUB_OUTPUT"
            echo "A task is already IN_PROGRESS. One agent at a time. Nothing to do."
          elif grep -A2 -E '^\s*- \[LC-I18N-[0-9]+\]' .ai/TASKS.md | grep -qE '^\s*owner:\s*unclaimed'; then
            echo "claimable=true" >> "$GITHUB_OUTPUT"
          else
            echo "claimable=false" >> "$GITHUB_OUTPUT"
            echo "No unclaimed LC-I18N task. Nothing to do."
          fi

      - uses: actions/setup-node@v4
        if: steps.queue.outputs.claimable == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: linguachat-frontend/package-lock.json

      - name: Install
        if: steps.queue.outputs.claimable == 'true'
        run: npm ci --prefix linguachat-frontend

      - uses: anthropics/claude-code-action@v1
        if: steps.queue.outputs.claimable == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are LinguaChat's internationalisation operator.

            READ FIRST and obey over this prompt: CLAUDE.md, .ai/TRANSLATIONS.md,
            .ai/TASKS.md, .ai/STATE.md.

            Requested task: "${{ inputs.task_id }}" (empty = the first unclaimed
            LC-I18N-* task). Requested language batch: "${{ inputs.languages }}"
            (empty = decide from the task, and keep the batch small).
            Dry run: "${{ inputs.dry_run }}" (true means change nothing; write your
            findings on the run summary and stop).

            THE THREE LANGUAGES ARE NOT INTERCHANGEABLE

            interface_language is the chrome. native_language is for explanations.
            target_language is what is being learned, and it is English today.
            The case that must always work: interface es + native ja + target en.
            NEVER translate the English the learner is practising. Explanations may
            and should use the native language.

            Arabic and other RTL languages: RTL chrome, LTR English target and
            input, and Chatto is never mirrored.

            HOW TO WORK

            1. Claim the task in .ai/TASKS.md (owner `claude-i18n`, and the branch),
               and use a branch named `i18n/<lowercase task id>`.
            2. Do only this task. Do not touch curriculum content, runtime logic or
               the frozen visual architecture. If a key is missing because an arc
               needs it, that belongs to the arc's PR, not to yours.
            3. Copy must read like real UI written in that language, not like a
               translation of English. Keep placeholders byte-for-byte, keep
               variables and function names, keep product names (LinguaChat, Lingua,
               Chatto), and keep pedagogical English in English.
            4. Never mark a language as supported when it only falls back to
               English. If coverage is partial, say so where the user can see it.
            5. QA: `cd linguachat-frontend && npm run check:i18n && npm run check:all
               && npm run build`. Count check:all by exit code. Report the real
               numbers — keys, per-language coverage, chunk sizes.
            EVIDENCE IS PART OF THE WORK, NOT A FORMALITY

            A green suite proves the suite ran, not that your change works. Exercise
            what you touched: a runtime change means walking the affected flow; an
            episode means the happy path AND a wrong answer with its retry AND
            help/model marked assisted AND replay without a duplicate reward; UI or
            i18n means a real browser at 390 px and 1440 px; an evaluator means the
            local and backend verdicts agreeing case by case. Always check:all
            (by exit code), build, compileall and pytest. After any fix, two clean
            cycles in a row.

            Put the numbers in the pull request under a `## Evidence` heading. CI
            fails a non-draft pull request that has no such section, and the chain
            refuses to merge it. If you could not run something on the runner, say
            so plainly rather than implying you did.

            6. Open a PULL REQUEST on your branch. Never push to main. Then update
               .ai/TRANSLATIONS.md with measured coverage, not intentions, and
               .ai/HANDOFF.md with where you stopped.

            Stop and open an issue instead of guessing if a language needs a product
            decision (which variants to offer, how to label partial coverage), or if
            adding a language would break a bundle budget without a justification.
          # A chained run is started by github-actions[bot], and the action refuses a
          # non-human initiator unless it is named — run 32181656533 died on exactly
          # that: "Workflow initiated by non-human actor: github-actions (type: Bot)".
          # ONE bot, by name. Never '*': that would let any bot with write access to
          # this repository start an agent holding the token.
          allowed_bots: github-actions
          claude_args: |
            --model claude-sonnet-5
            --max-turns 100
            --allowedTools Read,Write,Edit,Glob,Grep,Bash,TodoWrite

      - name: Nothing to do
        if: steps.queue.outputs.claimable != 'true'
        run: echo "No unclaimed i18n task — exiting without cost." >> "$GITHUB_STEP_SUMMARY"
